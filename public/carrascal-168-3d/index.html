<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrascal 168</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap">
<style>
/* VOICE: ferramenta técnica, calma, na identidade Carrascal 168 (igual ao visualizador GLB).
   IDEA: um modelo BIM que se desmonta — pisos, sistemas e camadas da cobertura ligam e desligam.
   PICTURE: o modelo ocupa o ecrã; painel lateral com filtros, árvore e ficha do elemento.
   COLOUR and TYPE: branco, palco #eef3f5, azul #acceda / #2b5564; Space Grotesk nos títulos, Inter no resto.
   LAYOUT: palco à esquerda, painel 360px à direita; abaixo de 800px o painel desce para baixo do palco. */
:root { --paper:#fff; --stage:#eef3f5; --ink:#0a0a0a; --muted:#5c5c5c; --rule:#d9dfe2; --azul:#acceda; --azul-deep:#2b5564;
  --display:'Space Grotesk','Arial Narrow',Arial,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:light; }
* { box-sizing:border-box; min-width:0; }
html, body { height:100%; margin:0; }
body { background:var(--paper); color:var(--ink); font:14px/1.45 var(--body); display:flex; flex-direction:column; overflow:hidden; }
header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:12px 16px 10px; border-bottom:1px solid var(--rule); }
h1 { font-family:var(--display); font-size:20px; line-height:1; margin:0; text-transform:uppercase; letter-spacing:-0.02em; }
h1 span { color:var(--azul-deep); }
#status { font-size:12px; color:var(--muted); margin:0; text-align:right; font-variant-numeric:tabular-nums; }
main { flex:1 1 auto; display:grid; grid-template-columns:minmax(0,1fr) 360px; min-height:0; }
#stage { position:relative; background:var(--stage); min-height:0; }
#stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.tools { position:absolute; left:10px; top:10px; right:10px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
.tools > * { pointer-events:auto; }
.cut { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; background:rgba(255,255,255,.92); border:1px solid var(--rule); border-radius:8px; padding:8px 10px; }
.cut label { display:grid; grid-template-columns:20px 64px 150px 52px; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.cut output { font-variant-numeric:tabular-nums; text-align:right; color:var(--ink); }
input[type=range] { width:100%; accent-color:var(--azul-deep); }
input[type=checkbox] { accent-color:var(--azul-deep); width:16px; height:16px; margin:0; }
button { font:500 12px/1 var(--body); color:var(--ink); background:#fff; border:1px solid var(--rule); border-radius:6px; padding:8px 10px; cursor:pointer; min-height:32px; }
button:hover { border-color:var(--azul-deep); }
button:focus-visible, summary:focus-visible { outline:2px solid var(--azul-deep); outline-offset:1px; }
button.on { background:var(--azul-deep); border-color:var(--azul-deep); color:#fff; }
button:disabled { opacity:.45; cursor:default; }
aside { border-left:1px solid var(--rule); display:flex; flex-direction:column; min-height:0; }
.block { padding:10px 14px; border-bottom:1px solid var(--rule); }
.block h2 { font:600 11px/1 var(--body); color:var(--muted); margin:0 0 8px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chips button { padding:6px 8px; min-height:28px; border-radius:14px; }
.chips button:not(.on) { color:var(--muted); background:#f6f8f9; text-decoration:line-through; text-decoration-color:#9aa; }
.chips button.on { background:var(--azul); border-color:var(--azul); color:var(--ink); }
#tree { flex:1 1 auto; overflow:auto; padding:6px 8px 12px; min-height:120px; }
.ptitle { font:600 11px/1 var(--body); color:var(--muted); margin:0; padding:10px 14px 8px; border-bottom:1px solid var(--rule); letter-spacing:.02em; }
.quick { position:absolute; left:10px; bottom:10px; background:rgba(255,255,255,.94); border:1px solid var(--rule); border-radius:8px; padding:8px 10px 10px; display:flex; flex-direction:column; gap:8px; max-width:calc(100% - 20px); }
.quick .chips button { border-radius:6px; }
.quick .chips button:not(.on) { text-decoration:none; color:var(--ink); background:#fff; }
.quick .chips button.on { background:var(--azul-deep); border-color:var(--azul-deep); color:#fff; }
#elems { padding:6px 8px; border-bottom:1px solid var(--rule); display:flex; flex-direction:column; gap:1px; }
#elems .row { padding-left:0; }
#elems .lab_ { flex:1 1 auto; padding:4px 4px; font-weight:500; cursor:pointer; border-radius:4px; }
#elems .lab_:hover { background:#f1f5f7; }
#psplit { flex:0 0 7px; cursor:row-resize; background:var(--rule); position:relative; touch-action:none; }
#psplit::after { content:''; position:absolute; left:50%; top:2px; width:36px; height:3px; margin-left:-18px; border-radius:2px; background:#b5c0c5; }
#psplit:hover, #psplit.drag { background:var(--azul); }
#exitIso { display:none; }
#exitIso.show { display:inline-block; }
.quick h2 { font:600 11px/1 var(--body); color:var(--muted); margin:0 0 5px; }
.eye { flex:0 0 auto; width:24px; height:22px; min-height:0; padding:0; border:0; background:none; border-radius:4px; display:inline-grid; place-items:center; color:var(--azul-deep); }
.eye:hover { background:#e6eef1; }
.eye svg { width:15px; height:15px; }
.eye .shut { display:none; }
.eye.hid { color:#9aa6ab; }
.eye.hid .open { display:none; }
.eye.hid .shut { display:block; }
.eye.some { color:#7f98a1; }
.eye .part { display:none; }
.eye.some .open { display:none; }
.eye.some .part { display:block; }
summary { display:flex; align-items:center; gap:2px; }
summary .t { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
summary::before { content:'▸'; color:var(--muted); font-size:10px; width:12px; flex:0 0 12px; }
details[open] > summary::before { content:'▾'; }
summary::-webkit-details-marker { display:none; }
summary { list-style:none; }
.row { display:flex; align-items:center; gap:2px; padding-left:12px; padding-right:4px; }
.row .el { padding-left:4px; }
details { margin-left:8px; }
summary { cursor:pointer; padding:3px 4px; border-radius:4px; font-weight:500; list-style-position:outside; }
summary small { color:var(--muted); font-weight:400; }
.n { flex:0 0 3.2ch; width:3.2ch; text-align:right; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; margin-right:4px; }
#tree > details { margin-left:0; }
.el { display:block; flex:1 1 auto; width:auto; text-align:left; border:0; background:none; padding:4px 6px 4px 22px; min-height:0; border-radius:4px; font-weight:400; color:#222; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.el:hover { background:#f1f5f7; }
.el.sel { background:var(--azul); }
.el.off { color:#aab; }
#props { flex:0 0 auto; height:300px; overflow:auto; padding:10px 14px 14px; background:#fbfcfd; }
#props h3 { font:700 15px/1.2 var(--display); margin:0 0 2px; }
#props .cls { color:var(--muted); font-size:12px; margin-bottom:8px; }
#props table { width:100%; border-collapse:collapse; font-size:12px; margin:4px 0 10px; }
#props td { padding:3px 0; border-bottom:1px solid #edf0f2; vertical-align:top; }
#props td:first-child { color:var(--muted); width:42%; padding-right:8px; }
#props td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; width:auto; color:var(--ink); }
#props h4 { font:600 11px/1 var(--body); color:var(--muted); margin:10px 0 4px; }
#props .acts { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 4px; }
.empty { color:var(--muted); font-size:12px; }
#labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; display:none; }
#labels.on { display:block; }
.lab { position:absolute; left:0; top:0; white-space:nowrap; font:500 11px/1 var(--body); color:var(--ink); font-variant-numeric:tabular-nums; will-change:transform; }
.lab::before { content:''; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--azul-deep); border:1.5px solid #fff; box-sizing:border-box; }
.lab .t { position:absolute; left:8px; top:-9px; display:flex; background:rgba(255,255,255,.92); border-radius:3px; padding:2px 4px; gap:4px; }
.lab.left .t { left:auto; right:8px; }
.lab b { font-weight:600; }
.lab span { color:var(--muted); }
#err { position:absolute; inset:54px 10px auto auto; max-width:60%; background:#fff3f0; border:1px solid #e8b4a8; color:#7a2410; padding:8px 10px; border-radius:6px; font-size:12px; display:none; }
@media (max-width:800px) {
  body { overflow:auto; height:auto; }
  main { grid-template-columns:1fr; }
  #stage { height:62vh; }
  aside { border-left:0; border-top:1px solid var(--rule); }
  #tree { max-height:50vh; }
  #props { flex-basis:auto; height:320px; }
  .quick { position:static; margin:0; border-radius:0; border-width:1px 0 0; max-width:none; }
  .cut label { grid-template-columns:20px 56px minmax(80px,1fr) 48px; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.81/web-ifc-api.js"
} }
</script>
</head>
<body>
<header>
  <h1>Carrascal <span>168</span></h1>
  <p id="status">A carregar…</p>
</header>
<main>
  <section id="stage">
    <div class="tools">
      <button data-view="iso">3D</button>
      <button data-view="rua">Rua</button>
      <button data-view="jardim">Jardim</button>
      <button data-view="topo">Topo</button>
      <button id="edges" class="on">Arestas</button>
      <button id="cotas" aria-pressed="false">Cotas</button>
      <button id="showall">Mostrar tudo</button>
      <button id="exitIso" class="on">Sair do isolamento</button>
    </div>
    <div class="cut">
      <label><input type="checkbox" id="cutH"><span>Altura</span><input type="range" id="hZ" step="0.01"><output id="hZo"></output></label>
      <label><input type="checkbox" id="cutV"><span>Corte x</span><input type="range" id="vX" step="0.01"><output id="vXo"></output></label>
    </div>
    <div class="quick"><div class="chips" id="fPisos" role="radiogroup" aria-label="Ver um piso por dentro"></div></div>
    <div id="labels"></div>
    <div id="err"></div>
  </section>
  <aside>
    <h2 class="ptitle">Atalhos</h2>
    <div id="elems"></div>
    <h2 class="ptitle">Hierarquia</h2>
    <div id="tree"></div>
    <div id="psplit" role="separator" aria-orientation="horizontal" aria-label="Redimensionar o painel de propriedades" tabindex="0"></div>
    <h2 class="ptitle">Propriedades</h2>
    <div id="props" style="border-top:0"><p class="empty">Clica num elemento do modelo ou da lista para ver a ficha: tipo, camadas, piso, sistema e propriedades.</p></div>
  </aside>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as WEBIFC from 'web-ifc';
import { readInfo } from './info.js';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const status = t => { $('#status').textContent = t; };
const fail = e => { console.error(e); const b = $('#err'); b.style.display = 'block'; b.textContent = 'Erro: ' + (e?.message || e); status('Erro ao carregar'); };

const ORDEM = ['Estrutura','Fachada da rua','Fachada do jardim','Empenas','Caixilharia exterior','Cantarias','Varandas',
  'Paredes interiores','Portas interiores','Tetos falsos','Cobertura','Escadas','Acabamentos interiores',
  'Equipamento das casas de banho','Cozinhas','Móveis fixos','Rua','Jardim'];
const ESCK = ['Lanços','Patamares','Vigas e calços','Guardas e corrimão'];
const escKey = e => ({ IfcStairFlight: 'Lanços', IfcSlab: 'Patamares', IfcMember: 'Vigas e calços', IfcRailing: 'Guardas e corrimão' }[e.cls] || null);
const COB = ['Telhas','Ripado','Subtelha','Painel','Vigas','Isolamento (lã)','Pladur (teto)','Caleiras e muretes','Chaminés','Trapeiras','Outros'];
const sysKey = s => ORDEM.find(k => s === k || s.startsWith(k + ' —')) || s || 'Outros';
const cobKey = e => {
  const t = e.type?.name, n = e.name;
  if (t === 'CB-T' || t === 'CB-TC') return 'Telhas';
  if (t === 'CB-RIP') return 'Ripado';
  if (t === 'CB-SUB') return 'Subtelha';
  if (t === 'CB-P') return 'Painel';
  if (e.cls === 'IfcBeam' || t === 'AR-VLX') return 'Vigas';
  if (t === 'TF-SOT' || t === 'PF-TETO') return 'Pladur (teto)';
  if (t === 'IS-SOT') return 'Isolamento (lã)';
  if (e.cls === 'IfcPipeSegment' || t === 'MC') return 'Caleiras e muretes';
  if (e.cls === 'IfcChimney') return 'Chaminés';
  if (/trapeira|Terraço/i.test(n)) return 'Trapeiras';
  return 'Outros';
};

// ---------- cena ----------
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef3f5);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c3c8, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-8, 20, 14); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(10, 6, -12); scene.add(fill);

const planeH = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100);
const planeV = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 100);
const clips = [];
const planeF = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100);   // corte do piso selecionado (por baixo da laje de cima)
const updateClips = () => { clips.length = 0; if ($('#cutH').checked) clips.push(planeH); if ($('#cutV').checked) clips.push(planeV); if (floorSel >= 0 && floorSel < 3) clips.push(planeF); };
const mOpaque = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .9, metalness: 0, side: THREE.DoubleSide, clippingPlanes: clips, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const mGlass = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .1, metalness: 0, transparent: true, opacity: .35, depthWrite: false, side: THREE.DoubleSide, clippingPlanes: clips });
const mSel = new THREE.MeshStandardMaterial({ color: 0x4f9fbf, emissive: 0x16404f, roughness: .6, side: THREE.DoubleSide, clippingPlanes: clips, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const mEdge = new THREE.LineBasicMaterial({ color: 0x33434a, transparent: true, opacity: .35, clippingPlanes: clips });

const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
const ro = new ResizeObserver(resize); ro.observe(stage);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); updateLabels(); });

// ---------- estado ----------
const E = new Map();          // id -> { info, meshes:[], edges, group, cob }
let box = new THREE.Box3(), selected = null;
const hidden = new Set();
let floorSel = -1, PISOS = [];
const FLOORS = [{ floor: 0, ceil: 3.45 }, { floor: 3.75, ceil: 6.35 }, { floor: 6.65, ceil: 9.15 }, { floor: 9.45, ceil: 13.2 }];   // pavimento e face de baixo da laje de cima (como no outro visualizador)
const ROOF3 = new Set(['Telhas', 'Ripado', 'Subtelha', 'Painel', 'Vigas', 'Isolamento (lã)', 'Pladur (teto)']);
const roofToPladur = e => /Velux/.test(e.info.name) || (e.sys === 'Cobertura' && (ROOF3.has(e.cob) || e.info.cls === 'IfcBeam' || e.info.type?.name === 'CT-OIT' || /Chaminé|Cantoneira/.test(e.info.name)));
const floorHide = e => {   // piso selecionado: esconde o que está por cima, os tetos falsos desse piso e, no sótão, a cobertura até ao pladur
  if (floorSel < 0) return false;
  const k = PISOS.indexOf(e.info.storey);
  if (k > floorSel) return true;
  if (k === floorSel && e.sys === 'Tetos falsos') return true;
  return floorSel === 3 && roofToPladur(e);
};
const QUICK = { 'Empenas': s => s === 'Empenas', 'Fachadas': s => s === 'Fachada da rua' || s === 'Fachada do jardim', 'Cobertura': s => s === 'Cobertura' };
const QIDS = {};   // atalho -> ids dos elementos
let isolated = null;

const visible = e => !floorHide(e) && !hidden.has(e.info.id) && (!isolated || isolated.has(e.info.id));
const applyVis = () => {
  for (const e of E.values()) { const v = visible(e); e.group.visible = v; e.btn?.classList.toggle('off', !v); }
  updateEyes();
  const n = [...E.values()].filter(visible).length;
  status(`${n} de ${E.size} elementos visíveis` + (isolated ? ' · isolado' : ''));
  $('#exitIso').classList.toggle('show', !!isolated);
  updateElems();
  if (LABS.length) occLater();
};

// ---------- carregar ----------
async function load() {
  const api = new WEBIFC.IfcAPI();
  api.SetWasmPath(new URL('./', location.href).href, true);
  status('A iniciar o leitor IFC…');
  await api.Init(undefined, true);
  status('A ler Carrascal168.ifc…');
  const buf = await (await fetch('./Carrascal168.ifc')).arrayBuffer();
  const m = api.OpenModel(new Uint8Array(buf), { COORDINATE_TO_ORIGIN: false });
  const info = readInfo(api, WEBIFC, m);
  status('A gerar geometria…');
  const tmp = new THREE.Matrix4(), v = new THREE.Vector3(), n = new THREE.Vector3(), nm = new THREE.Matrix3();
  api.StreamAllMeshes(m, fm => {
    const id = fm.expressID, parts = { o: [], g: [] };
    for (let i = 0; i < fm.geometries.size(); i++) {
      const pg = fm.geometries.get(i), geo = api.GetGeometry(m, pg.geometryExpressID);
      const va = api.GetVertexArray(geo.GetVertexData(), geo.GetVertexDataSize());
      const ia = api.GetIndexArray(geo.GetIndexData(), geo.GetIndexDataSize());
      tmp.fromArray(pg.flatTransformation); nm.getNormalMatrix(tmp);
      const c = pg.color, nv = va.length / 6, pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), col = new Float32Array(nv * 3);
      for (let k = 0; k < nv; k++) {
        v.set(va[k*6], va[k*6+1], va[k*6+2]).applyMatrix4(tmp); pos.set([v.x, v.y, v.z], k*3);
        n.set(va[k*6+3], va[k*6+4], va[k*6+5]).applyMatrix3(nm).normalize(); nor.set([n.x, n.y, n.z], k*3);
        col.set([c.x, c.y, c.z], k*3);
      }
      (c.w < 0.99 ? parts.g : parts.o).push({ pos, nor, col, idx: ia.slice() });
      geo.delete();
    }
    const group = new THREE.Group(); group.userData.id = id;
    const meshes = [];
    for (const [k, list] of Object.entries(parts)) {
      if (!list.length) continue;
      const g = merge(list), mesh = new THREE.Mesh(g, k === 'g' ? mGlass : mOpaque);
      mesh.userData.id = id; mesh.userData.base = mesh.material; group.add(mesh); meshes.push(mesh);
      if (k === 'o') { const ed = new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), mEdge); ed.userData.edge = true; group.add(ed); }
      g.computeBoundingBox(); box.union(g.boundingBox);
    }
    scene.add(group);
    const el = info.elem(id), sys = sysKey(el.system);
    E.set(id, { info: el, sys, cob: sys === 'Cobertura' ? cobKey(el) : null, esc: sys === 'Escadas' ? escKey(el) : null, meshes, group });
  });
  api.CloseModel(m);
  buildUI(info);
  buildLabels();
  try { if (localStorage.getItem('c168-cotas') === '1') $('#cotas').click(); } catch {}
  setupCuts();
  view('iso');
  applyVis();
}
function merge(list) {
  let nv = 0, ni = 0; for (const p of list) { nv += p.pos.length; ni += p.idx.length; }
  const pos = new Float32Array(nv), nor = new Float32Array(nv), col = new Float32Array(nv), idx = new Uint32Array(ni);
  let ov = 0, oi = 0;
  for (const p of list) { pos.set(p.pos, ov); nor.set(p.nor, ov); col.set(p.col, ov); for (let i = 0; i < p.idx.length; i++) idx[oi + i] = p.idx[i] + ov / 3; ov += p.pos.length; oi += p.idx.length; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

// ---------- interface ----------
function chips(el, keys, off, label = k => k) {
  el.innerHTML = keys.map(k => `<button class="on" data-k="${esc(k)}" aria-pressed="true">${esc(label(k))}</button>`).join('');
  el.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const k = b.dataset.k, on = off.has(k); on ? off.delete(k) : off.add(k);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); applyVis();
  });
}
const EYE = '<svg class="part" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z" stroke-dasharray="3 2.6"/><path d="M12 9a3 3 0 0 0 0 6z" fill="currentColor"/><circle cx="12" cy="12" r="3"/></svg><svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10.5 7 10.5 7a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 1.5 12S5.5 19 12 19a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const GRP = [];   // índice -> ids dos elementos do grupo (botão do olho)
const idsOf = b => b.dataset.q != null ? QIDS[b.dataset.q] : b.dataset.g != null ? GRP[+b.dataset.g] : [+b.dataset.id];
function updateEyes() {   // três estados: visível, escondido e parcial (há filhos diferentes dos outros)
  for (const b of document.querySelectorAll('#tree .eye, #elems .eye')) {
    const ids = idsOf(b);
    const nh = ids.reduce((s, id) => s + hidden.has(id), 0);
    b.classList.toggle('hid', nh === ids.length); b.classList.toggle('some', nh > 0 && nh < ids.length);
    b.setAttribute('aria-pressed', nh === ids.length ? 'true' : 'false');
    b.title = nh === ids.length ? 'Mostrar' : nh ? 'Parcialmente escondido — carregar para esconder tudo' : 'Esconder';
  }
}
function updateElems() {}
function toggleIds(ids) {   // tudo escondido -> mostra tudo; senão (visível ou parcial) esconde tudo
  const allHidden = ids.every(id => hidden.has(id));

}
function pickFloor(k) {   // um piso de cada vez; voltar a carregar no mesmo mostra tudo
  floorSel = k;
  for (const b of document.querySelectorAll('#fPisos button')) { const on = +b.dataset.k === k; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); }

  updateClips(); applyVis();
  if (k >= 0) { const dy = FLOORS[k].floor + 1 - controls.target.y; controls.target.y += dy; camera.position.y += dy; }
  else view('iso');
}
function buildUI(info) {
  const all = [...E.values()];
  const pisos = info.storeys.map(s => s.name).filter(p => all.some(e => e.info.storey === p));
  const sist = [...new Set(all.map(e => e.sys))].sort((a, b) => (ORDEM.indexOf(a) + 1 || 99) - (ORDEM.indexOf(b) + 1 || 99));
  const cob = COB.filter(k => all.some(e => e.cob === k));
  PISOS = pisos;
  $('#fPisos').innerHTML = '<button role="radio" aria-checked="true" class="on" data-k="-1">Todos</button>' + pisos.map((p, k) => `<button role="radio" aria-checked="false" data-k="${k}">${esc(p)}</button>`).join('');
  $('#fPisos').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) pickFloor(+b.dataset.k === floorSel ? -1 : +b.dataset.k); });   // 'Todos' (-1) ou voltar a carregar no piso escolhido mostra tudo
  for (const k of Object.keys(QUICK)) QIDS[k] = all.filter(e => QUICK[k](e.sys)).map(e => e.info.id);
  $('#elems').innerHTML = Object.keys(QUICK).filter(k => QIDS[k].length).map(k => `<div class="row"><span class="lab_" data-q="${esc(k)}">${esc(k)}</span><small class="n"></small><button class="eye" data-q="${esc(k)}" aria-label="Ver ou esconder ${esc(k)}">${EYE}</button></div>`).join('');
  $('#elems').addEventListener('click', ev => { const t = ev.target.closest('[data-q]'); if (!t) return; toggleIds(QIDS[t.dataset.q]); });
  // árvore: piso > sistema (> camada da cobertura) > elemento; cada grupo e cada elemento com olho para ver/esconder
  const byName = (a, b) => a.info.name.localeCompare(b.info.name, 'pt', { numeric: true });
  const eyeG = items => { GRP.push(items.map(e => e.info.id)); return `<button class="eye" data-g="${GRP.length - 1}" aria-label="Ver ou esconder o grupo">${EYE}</button>`; };
  const leaf = e => `<div class="row"><button class="el" data-id="${e.info.id}" title="${esc(e.info.name)}">${esc(e.info.name || e.info.cls)}</button><small class="n"></small><button class="eye" data-id="${e.info.id}" aria-label="Ver ou esconder">${EYE}</button></div>`;
  const det = (title, items, inner) => `<details><summary><span class="t">${esc(title)}</span><small class="n">${items.length}</small>${eyeG(items)}</summary>${inner}</details>`;

  $('#tree').innerHTML = pisos.map(p => {   // piso > sistema > elemento; a cobertura é um grupo à parte, na raiz, depois do piso 3 (Diogo)
    const ep = all.filter(e => e.info.storey === p && e.sys !== 'Cobertura');
    if (!ep.length) return '';
    return det(p, ep, sist.filter(s => s !== 'Cobertura' && ep.some(e => e.sys === s)).map(s => {
      const es = ep.filter(e => e.sys === s).sort(byName);
      if (s === 'Escadas') return det(s, es, ESCK.filter(k => es.some(e => e.esc === k)).map(k => { const ek = es.filter(e => e.esc === k); return det(k, ek, ek.map(leaf).join('')); }).join(''));
      return det(s, es, es.map(leaf).join(''));
    }).join(''));
  }).join('') + (ecob.length ? det('Cobertura', ecob, cobGroup(ecob)) : '')
    + (() => {   // o que não está num piso (rua e jardim, no lote): grupo na raiz, por sistema
      const fora = all.filter(e => !pisos.includes(e.info.storey) && e.sys !== 'Cobertura'); if (!fora.length) return '';
      return [...new Set(fora.map(e => e.sys))].map(s => { const es = fora.filter(e => e.sys === s).sort(byName); return det(s, es, es.map(leaf).join('')); }).join('');
    })();
  for (const b of document.querySelectorAll('#tree .el')) E.get(+b.dataset.id).btn = b;
  $('#tree').addEventListener('click', ev => {
    const eye = ev.target.closest('.eye');
    if (eye) {
      ev.preventDefault(); ev.stopPropagation();   // não abre/fecha o grupo
      toggleIds(idsOf(eye)); return;
    }
    const b = ev.target.closest('.el'); if (b) select(+b.dataset.id, true);
  });
}

function select(id, fromTree = false, keep = false) {

  const row = (k, v) => v == null || v === '' ? '' : `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`;
  const fmt = v => typeof v === 'boolean' ? (v ? 'sim' : 'não') : typeof v === 'number' ? (+v.toFixed(3)).toLocaleString('pt-PT') : v;
  const tot = i.layers.reduce((s, l) => s + (l.t || 0), 0);
  box_.innerHTML = `<h3>${esc(i.name || i.cls)}</h3><div class="cls">${esc(i.cls)} · #${i.id}</div>
    <div class="acts"><button id="aIso"${isolated && isolated.has(id) ? ' class="on"' : ''}>${isolated && isolated.has(id) ? 'Sair do isolamento' : 'Isolar'}</button><button id="aHide"${hidden.has(id) ? ' class="on"' : ''}>${hidden.has(id) ? 'Mostrar' : 'Esconder'}</button><button id="aFocus">Centrar</button></div>
    <table>${row('Piso', i.storey)}${row('Sistema', i.system)}${e.cob ? row('Camada', e.cob) : ''}${e.esc ? row('Parte', e.esc) : ''}${row('Tipo', i.type && (i.type.name + (i.type.desc ? ' — ' + i.type.desc : '')))}${row('Descrição', i.desc)}${row('Etiqueta', i.tag)}</table>
    ${i.layers.length ? `<h4>Composição${tot ? ' · ' + (tot * 100).toLocaleString('pt-PT', { maximumFractionDigits: 1 }) + ' cm' : ''}</h4><table>${i.layers.map(l => `<tr><td colspan="${l.t ? 1 : 2}" style="width:auto;color:var(--ink)">${esc(l.name)}</td>${l.t ? `<td class="n">${esc((l.t * 100).toLocaleString('pt-PT', { maximumFractionDigits: 1 }))} cm</td>` : ''}</tr>`).join('')}</table>` : ''}
    ${i.psets.map(ps => `<h4>${esc(ps.name)}</h4><table>${ps.props.map(([k, v]) => row(k, fmt(v))).join('')}</table>`).join('')}`;

  $('#aFocus').onclick = () => focus(id);
}
function focus(id) {
  const b = new THREE.Box3().setFromObject(E.get(id).group), c = b.getCenter(new THREE.Vector3()), r = Math.max(b.getSize(new THREE.Vector3()).length(), 1.5);
  const dir = camera.position.clone().sub(controls.target).normalize();

}
function view(k) {

  const d = { iso: [0.9, 0.55, 1.1], rua: [0, 0.15, 1], jardim: [0, 0.15, -1], topo: [0.001, 1, 0.001] }[k];

// ---------- seleção no modelo ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', ev => { down = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', ev => {
  if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const objs = []; for (const e of E.values()) if (e.group.visible) objs.push(...e.meshes);
  const hit = ray.intersectObjects(objs, false).find(h => clips.every(p => p.distanceToPoint(h.point) >= 0));
  select(hit ? hit.object.userData.id : null);
});

// ---------- cortes ----------
function setupCuts() {
  const h = $('#hZ'), x = $('#vX');
  h.min = box.min.y.toFixed(2); h.max = box.max.y.toFixed(2); h.value = (9.45 + 1.2).toFixed(2);
  x.min = box.min.x.toFixed(2); x.max = box.max.x.toFixed(2); x.value = 0;
  const upd = () => { planeH.constant = +h.value; planeV.constant = +x.value; $('#hZo').textContent = (+h.value).toFixed(2) + ' m'; $('#vXo').textContent = (+x.value).toFixed(2) + ' m'; updateClips(); if (LABS.length) occLater(); };
  for (const el of [h, x, $('#cutH'), $('#cutV')]) el.addEventListener('input', upd);
  h.addEventListener('input', () => { if (!$('#cutH').checked) { $('#cutH').checked = true; upd(); } });
  x.addEventListener('input', () => { if (!$('#cutV').checked) { $('#cutV').checked = true; upd(); } });
  upd();
}

// ---------- cotas: um ponto em cada sítio importante, com a cota relativa à soleira e a absoluta ----------
const Z0 = 77.43;                    // cota absoluta da soleira (piso 0 acabado)
const LABS = [];
const fmt2 = v => (v > -0.005 ? '+' : '−') + Math.abs(v).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const abs2 = v => (Z0 + v).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mid = (a, b) => (a + b) / 2;
const cutX = (x0, b) => $('#cutV').checked ? Math.max(b.min.x + 0.05, Math.min(x0, planeV.constant - 0.05)) : x0;   // com o corte vertical, o ponto fica junto à face cortada
const REGRAS = [   // elemento -> ponto na face de cima (coordenadas do visualizador: y para cima, z para o lado da rua)
  [/^Soleira da porta de entrada$/, b => [mid(b.min.x, b.max.x), b.max.y, b.max.z]],
  [/^Laje do Piso \d$/, b => [cutX(b.max.x - 0.6, b), b.max.y, b.max.z - 0.05]],
  [/^Pavimento da varanda da rua \(Piso \d\)$/, b => [cutX(mid(b.min.x, b.max.x), b), b.max.y, b.max.z - 0.1]],
  [/^Pavimento da varanda do tardoz \(Piso \d\)$/, b => [cutX(mid(b.min.x, b.max.x), b), b.max.y, b.min.z + 0.1]],
  [/^Platibanda da fachada (da rua|do jardim)$/, b => [cutX(mid(b.min.x, b.max.x), b), b.max.y, mid(b.min.z, b.max.z)]],
  [/^Telhões de cumeeira$/, b => [cutX(mid(b.min.x, b.max.x), b), b.max.y, mid(b.min.z, b.max.z)]],
  [/^Trapeira (grande|pequena) — cobertura plana$/, b => [mid(b.min.x, b.max.x), b.max.y, mid(b.min.z, b.max.z)]],
  [/^Terraço da trapeira — mureto da frente$/, b => [mid(b.min.x, b.max.x), b.max.y, mid(b.min.z, b.max.z)]],
  [/^Soleira da porta de sacada$/, b => [mid(b.min.x, b.max.x), b.max.y, b.min.z + 0.02]],   // cotas dos pisos na fachada de trás
  [/^Chaminé (direita|esquerda)$/, b => [mid(b.min.x, b.max.x), b.max.y, mid(b.min.z, b.max.z)]],
];
function buildLabels() {
  const html = [];
  for (const e of E.values()) for (const [re, at] of REGRAS) {
    if (!re.test(e.info.name)) continue;
    const b = new THREE.Box3().setFromObject(e.group), z = b.max.y;
    LABS.push({ e, b, at, re, key: /Soleira da porta de sacada/.test(e.info.name) ? 'sol' + z.toFixed(2) : null, p: new THREE.Vector3(...at(b)), vis: false }); html.push(`<div class="lab${/^Pavimento da varanda/.test(e.info.name) ? ' left' : ''}" title="${esc(e.info.name)}"><div class="t"><b>${esc(fmt2(z))}</b><span>${esc(abs2(z))}</span></div></div>`);
  }
  $('#labels').innerHTML = html.join(''); [...$('#labels').children].forEach((el, i) => LABS[i].el = el);
}
// visibilidade: só se o ponto se vê da câmara (nada à frente dele); calcula-se quando a vista muda, com um pequeno atraso
const occRay = new THREE.Raycaster(), _d = new THREE.Vector3();
function occlusion() {
  const objs = []; for (const e of E.values()) if (e.group.visible && e.info.cls !== 'IfcRailing') objs.push(...e.meshes);   // as guardas (barras) não tapam
  for (const L_ of LABS) {
    L_.p.set(...L_.at(L_.b));
    if (!L_.e.group.visible || !clips.every(pl => pl.distanceToPoint(L_.p) >= -0.01)) { L_.vis = false; continue; }
    _d.copy(L_.p).sub(camera.position); const dist = _d.length(); occRay.set(camera.position, _d.normalize()); occRay.far = dist - 0.03;
    const own = new Set(L_.e.meshes);
    const hit = occRay.intersectObjects(objs, false).find(h => !own.has(h.object) && clips.every(pl => pl.distanceToPoint(h.point) >= 0));
    L_.vis = !hit;
  }
  const seen = new Set();   // peças iguais à mesma cota (as duas soleiras de cada piso): mostra-se só a primeira que está à vista
  for (const L_ of LABS) if (L_.key && L_.vis) { if (seen.has(L_.key)) L_.vis = false; else seen.add(L_.key); }
}
let occT = null; const occLater = () => { clearTimeout(occT); occT = setTimeout(occlusion, 120); };
controls.addEventListener('change', occLater);
const _v = new THREE.Vector3();
function updateLabels() {
  if (!$('#labels').classList.contains('on')) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const L_ of LABS) {
    _v.copy(L_.p).project(camera);
    const ok = L_.vis && _v.z < 1 && Math.abs(_v.x) < 1.05 && Math.abs(_v.y) < 1.05;
    L_.el.style.display = ok ? '' : 'none';
    if (ok) L_.el.style.transform = `translate(${(_v.x + 1) / 2 * w}px, ${(1 - _v.y) / 2 * h}px)`;
  }
}
$('#cotas').addEventListener('click', ev => { const on = !$('#labels').classList.contains('on'); $('#labels').classList.toggle('on', on); ev.currentTarget.classList.toggle('on', on); ev.currentTarget.setAttribute('aria-pressed', on); if (on) occlusion(); try { localStorage.setItem('c168-cotas', on ? '1' : '0'); } catch {} });

// ---------- barra ----------
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => view(b.dataset.view));
$('#edges').addEventListener('click', ev => { const on = !ev.currentTarget.classList.contains('on'); ev.currentTarget.classList.toggle('on', on); mEdge.visible = on; });
$('#showall').addEventListener('click', () => { hidden.clear(); isolated = null; pickFloor(-1); if (selected) select(selected, true, true); });
$('#exitIso').addEventListener('click', () => { isolated = null; applyVis(); if (selected) select(selected, true, true); });
// ---------- painel de propriedades redimensionável (arrastar a barra; fica guardado) ----------
{
  const sp = $('#psplit'), pr = $('#props'), aside = document.querySelector('aside');
  const setH = h => { const max = aside.clientHeight - 160; h = Math.max(90, Math.min(max, h)); pr.style.height = h + 'px'; try { localStorage.setItem('c168-props-h', String(Math.round(h))); } catch {} };
  try { const h = +localStorage.getItem('c168-props-h'); if (h) pr.style.height = h + 'px'; } catch {}
  let y0 = null, h0 = 0;
  sp.addEventListener('pointerdown', ev => { y0 = ev.clientY; h0 = pr.getBoundingClientRect().height; sp.setPointerCapture(ev.pointerId); sp.classList.add('drag'); ev.preventDefault(); });
  sp.addEventListener('pointermove', ev => { if (y0 != null) setH(h0 + (y0 - ev.clientY)); });
  const end = () => { y0 = null; sp.classList.remove('drag'); };
  sp.addEventListener('pointerup', end); sp.addEventListener('pointercancel', end);
  sp.addEventListener('keydown', ev => { if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') { setH(pr.getBoundingClientRect().height + (ev.key === 'ArrowUp' ? 30 : -30)); ev.preventDefault(); } });
}
addEventListener('keydown', ev => { if (ev.key === 'Escape') select(null); });

load().catch(fail);
